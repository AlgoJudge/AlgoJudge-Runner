# PostgreSQL, the Server and a Runner, for development and for the tests that
# need all three.
#
#   docker compose -f example-runner-development-docker-compose.yaml up -d --build --wait
#   ./x test --test conformance -- --include-ignored --test-threads=1
#   docker compose -f example-runner-development-docker-compose.yaml down -v
#
# **`--test-threads=1` is a requirement of that suite, not a preference.** Several
# of its cases drain the queue or read a submission's state, and two running at
# once take each other's jobs. The recipe here dropped it until 2026-08-31, alone
# among the three copies in this repository.
#
# **Not the production stack.** That is `AlgoJudge-Ops`, which has existed since
# 2026-08-30 — this said it did not, and said so until 2026-08-31. What stays
# true is the division: Ops is what an administrator installs, this is how a
# developer runs the Server. This one builds it from a sibling checkout, so it
# needs `AlgoJudge-Server` beside this repository, and it publishes the Server's
# port so a test on the host can drive it.

name: algojudge-runner-dev

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # One level above PGDATA on purpose: PostgreSQL 18 keeps its data in
    # `/var/lib/postgresql/18/docker`, and mounting the inner path shadows the
    # version directory the image creates.
    volumes:
      - algojudge_runner_dev_db:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: algojudge
      POSTGRES_USER: algojudge
      POSTGRES_DB: algojudge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algojudge -d algojudge"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      # A sibling checkout by default, which is how the workspace is laid out.
      # Overridable because GitHub Actions cannot check a repository out above
      # its own workspace, so CI puts it in a subdirectory and says so here.
      context: ${AJ_SERVER_CONTEXT:-../AlgoJudge-Server}
      dockerfile: AlgoJudge.Server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Published so a test on the host can drive the manager and participant
    # halves. Overridable because 8080 is a popular port and a developer may
    # already have something on it — including another AlgoJudge stack.
    ports:
      - "127.0.0.1:${AJ_SERVER_PORT:-8080}:8080"
    environment:
      DOTNET_ENVIRONMENT: Development
      AJ_ConnectionStrings__DbConnectionString: Host=postgres;Database=algojudge;Username=algojudge;Password=algojudge
      # **Without this the Server refuses to start**, and has since 2026-08-23:
      # nothing may be assumed about whose word to take for a visitor's address.
      # `none` is the full answer for a Server reached directly, which this one
      # is. This file went without it for a day and the stack it exists to raise
      # would not come up.
      AJ_Forwarded__KnownProxies: none
      # What `/admin/**` asks for on top of being called from inside the
      # container: the maintenance switch and the endpoint that sets the
      # administrator's password. **Empty closes the whole group.**
      #
      # An operator with a `.env` beside this file gets theirs; a developer with
      # none gets a token named for exactly what it is, so a development stack
      # can take itself off the air and CI needs no secret to test that it can.
      # The Server says so at Warning on every start where this value is in
      # force outside Development.
      AJ_Admin__Token: ${AJ_ADMIN_TOKEN:-admin-token-development-only}
      # How long maintenance may drain before it closes anyway. Production
      # leaves this at 300.
      #
      # Short here because **the development seed deliberately holds two jobs in
      # `Running`** — it is telling the story "these two submissions are being
      # evaluated right now", which is what a screenshot needs. Nothing will ever
      # finish them: they carry no lease, so no reaper can reclaim them either.
      # A drain therefore always reaches the forced path on this stack, and
      # waiting five minutes for it on every try teaches an operator that the
      # switch is broken.
      AJ_Maintenance__ForceAfterSeconds: "20"
      # **Without this the Server refuses to start**, and has since 2026-08-13:
      # where the files of a product go is not a thing to inherit from a default
      # nobody read, so an installation that says nothing is told to say
      # something. This file predates that and went on saying nothing, which is
      # why the integration job could not bring a stack up at all.
      #
      # `postgres` because it needs no second service — the bytes go in the
      # database this stack already runs, which is the right trade for a
      # development stack and the wrong one for a deployment. `objects` is the
      # default store id, so naming it that means no `Storage__Default` is
      # needed. A real deployment configures `s3` or `filesystem`; see
      # `docs/specs/FILE_STORAGE.md`.
      AJ_Storage__Stores__objects__Kind: postgres

  runner:
    build:
      context: .
    restart: unless-stopped
    # Root **in its own container**, and it is not only a development
    # convenience any more.
    #
    # The image runs as `nonroot`. Two things need root here. Docker Desktop's
    # socket is `root:root` mode 755 — world-readable, not world-writable — so
    # there is no group to join and a non-root process simply cannot use it;
    # `group_add: [<docker gid>]` is the answer on a Linux host. And **the
    # cgroup tree's directories are root's**, so measuring needs it whichever
    # backend is chosen: `mkdir` under `cgroupfs`, the `memory.peak` reset under
    # `systemd`. `AlgoJudge-Ops` sets the same for the same reason.
    #
    # What this costs is smaller than it looks, and worth stating rather than
    # hiding: **anything that can reach that socket is root on the host**, so the
    # uid inside the container was never the boundary. The boundary is the host,
    # which is treated as compromised by assumption.
    user: "0:0"
    depends_on:
      server:
        condition: service_healthy
    environment:
      # The compose network name, not localhost: this is the Runner's own view
      # of the Server, and it is a different address from the browser's.
      AJ_Server__BaseUrl: http://server:8080/api/v1
      AJ_Runner__Name: runner-dev
      AJ_Runner__ProblemTypes: standard-io@1,output-only@1
      # Which pools this Runner belongs to, comma-separated — a laboratory, a
      # room, a machine class. Left unset it is in `default`, which is where
      # every untagged activity's work is, and it behaves as every Runner did
      # before tags existed.
      #
      # **Read once.** The Server takes it at the first registration and the
      # panel owns it from then on, so changing it here later changes nothing:
      # a restart must not be able to move a Runner into an examination's pool.
      # It is here so a room of machines can be deployed from one file rather
      # than tagged one at a time.
      #
      # AJ_Runner__Tags: lab-a
      # Short, so a developer watching the log sees it ask rather than wondering
      # whether it is alive. Production leaves these alone.
      AJ_Poll__MinSeconds: "1"
      AJ_Poll__MaxSeconds: "5"
      RUST_LOG: info,aj_protocol=debug
      # Scratch, as the **daemon** sees it. It has to match the host side of the
      # bind mount below: the Runner starts sibling containers and hands them
      # paths, and the daemon resolves those — a path only this container knows
      # produces an empty directory rather than an error.
      AJ_Work__Path: /var/lib/algojudge-runner/work
      AJ_Work__HostPath: ${PWD}/.runner-work
      # **No `AJ_Sandbox__AllowUnmeasured` here, deliberately.** It used to set
      # the old spelling of it so a development stack would start on a Docker
      # Desktop reporting cgroup v1. Starting is no longer the interesting part:
      # a time limit is decided on processor time read from the run's own
      # cgroup, so a Runner that starts without one fails every job it claims.
      # The mount below is what makes this stack judge; the flag would only make
      # it come up and then refuse work, one job at a time.
    volumes:
      - algojudge_runner_dev_identity:/var/lib/algojudge-runner
      - algojudge_runner_dev_cache:/var/cache/algojudge-runner
      - ${PWD}/.runner-work:/var/lib/algojudge-runner/work
      # **Writable, and judging needs it.** Each job container is started under
      # a cgroup that outlives it, and `memory.peak` and `cpu.stat` are read
      # back once the child is gone — a container's own cgroup does not outlive
      # it, and the runtime API reports no peak on v2. A time limit is compared
      # against the processor time that read produces.
      #
      # Which cgroup depends on the daemon's driver and the Runner decides it at
      # start; writable serves both. `cgroup: host` below matters as much as the
      # mount: without it this container sees its own cgroup as the root, and
      # the path it reads is not the path the daemon resolved `--cgroup-parent`
      # against.
      - /sys/fs/cgroup:/sys/fs/cgroup
      # The Runner is trusted and holds the socket; **nothing it starts ever
      # does**. Mounting it read-only would restrict nothing that matters — the
      # flag applies to the socket file, not to the API spoken over it — so the
      # boundary is the host, which is treated as compromised by assumption.
      - /var/run/docker.sock:/var/run/docker.sock
    # No ports. The Runner opens every connection itself, which is what lets a
    # real one live behind NAT with no inbound access at all.

    # == `--cgroupns=host`. See the volume above.
    cgroup: host

volumes:
  algojudge_runner_dev_db:
  algojudge_runner_dev_identity:
  algojudge_runner_dev_cache:
