[workspace]
resolver = "2"
members = ["crates/aj-package", "crates/aj-protocol", "crates/aj-runner"]

# `aj-sandbox` and `aj-standard-io` arrive with the rest of the evaluation
# pipeline. Creating them empty now would add two crates that compile to nothing
# and two names in every dependency graph, to no end.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/AlgoJudge/AlgoJudge-Runner"

[workspace.dependencies]
# These are ranges, not the record. **`Cargo.lock` is the record** — it is
# committed, it names an exact version and a checksum for every crate in the
# graph, and it is what a reviewer reads to answer "which version". A comment
# claiming a version here would be a second source that drifts from the first.
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
# The same `rand_core` `ed25519-dalek` itself uses, so the graph holds one copy.
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "stream",
    "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `serde_yaml` was archived by its author in 2024. This is the maintained fork,
# and a package's `config.yml` is written by a problem author rather than by a
# participant — semi-trusted, not untrusted — but an unmaintained parser on any
# input path is a liability worth avoiding.
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
# The artefact is a static binary in a scratch image; size is worth the link
# time, and one codegen unit lets the optimiser see across the crate graph.
codegen-units = 1
lto = true
strip = true
