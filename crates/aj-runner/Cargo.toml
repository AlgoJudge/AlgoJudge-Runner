[package]
name = "aj-runner"
description = "The AlgoJudge Runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "algojudge-runner"
path = "src/main.rs"

[dependencies]
aj-output-only = { path = "../aj-output-only" }
aj-package = { path = "../aj-package" }
aj-protocol = { path = "../aj-protocol" }
aj-sandbox = { path = "../aj-sandbox" }
aj-standard-io = { path = "../aj-standard-io" }

anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Driving the Server as a manager and as a participant, which is a session and
# a cookie rather than a Runner token.
reqwest = { workspace = true, features = ["cookies", "multipart"] }
hex.workspace = true
sha2.workspace = true
# The clock, stopped. Renewal is a timer against a ten-minute lease, and a test
# that proved anything about it by waiting would take ten minutes to run.
# `test-util` is not part of `full`, and it is wanted only here — a release build
# must not carry the ability to pause time.
tokio = { workspace = true, features = ["test-util"] }
