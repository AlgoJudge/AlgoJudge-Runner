name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The same compiler `./x` uses, pinned by digest rather than by tag so that
    # CI and a developer's machine cannot drift onto two versions without
    # either of them being told.
    container:
      image: rust@sha256:3b2879047d42784ca9403ad20c51ed3df361a50f1df96f5777d39b4e33aa65cd

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # `rust:slim` installs the minimal profile, which has neither.
      - name: Add the components the gate needs
        run: rustup component add rustfmt clippy

      # Cheapest first: formatting fails in a second, a release build takes
      # minutes, and there is no reason to spend the minutes to learn about a
      # missing newline.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      # Unit tests only. Anything that needs a Server, a database or a container
      # runtime is `#[ignore]`d and runs in `integration` below.
      - name: Test
        run: cargo test --workspace

  # **Both cgroup drivers, because there are two measurement backends and no
  # host can be both.** A cgroup parent is a path under `cgroupfs` and a slice
  # under `systemd`; the Runner chooses from what the daemon reports, so a job
  # pinned to one leaves the other unproven. Set explicitly on both legs rather
  # than inherited, so a change to the image's default cannot silently drop one.
  integration:
    name: integration (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      # One driver failing is exactly what the other leg cannot tell you.
      fail-fast: false
      matrix:
        driver: [cgroupfs, systemd]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The stack builds the Server from source. A checkout may not go above
      # the workspace, so it lands in a subdirectory and the compose file is
      # told where to look.
      - name: Check out the Server
        uses: actions/checkout@v7
        with:
          repository: AlgoJudge/AlgoJudge-Server
          path: algojudge-server

      # One daemon option and a restart, on a machine thrown away after the job.
      - name: Give the daemon the ${{ matrix.driver }} cgroup driver
        run: |
          echo '{"exec-opts":["native.cgroupdriver=${{ matrix.driver }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'cgroup {{.CgroupVersion}} / {{.CgroupDriver}}, kernel {{.KernelVersion}}'

      # Asserted rather than trusted. A daemon that ignored the option above
      # would leave this matrix testing one driver twice and reporting two
      # passes — which is how the `systemd` backend went unexercised for a day.
      - name: This host is the one this leg is about
        run: |
          test "$(docker info --format '{{.CgroupVersion}}/{{.CgroupDriver}}')" = "2/${{ matrix.driver }}"

      - name: Bring up PostgreSQL, the Server and the Runner
        env:
          AJ_SERVER_CONTEXT: ./algojudge-server
        run: >
          docker compose -f example-runner-development-docker-compose.yaml
          up -d --build --wait

      # On the stack's network, addressing the Server by its service name. No
      # published port is involved, so this works the same here as it would
      # against a deployment.
      - name: Prove the protocol against a real Server
        env:
          AJ_DOCKER_NETWORK: algojudge-runner-dev_default
          AJ_TEST_SERVER: http://server:8080/api/v1
        run: ./x test --test conformance -- --include-ignored --test-threads=1

      # The milestone: a submission goes in and the right mark comes out, with
      # the Runner in the stack doing the judging and nobody helping it.
      - name: Build the language images
        run: |
          docker build -t algojudge/lang-gcc:local    -f images/gcc/Dockerfile images/
          docker build -t algojudge/lang-clang:local  -f images/clang/Dockerfile images/
          docker build -t algojudge/lang-python:local -f images/python/Dockerfile images/
          docker build -t algojudge/lang-pypy:local   -f images/pypy/Dockerfile images/

      - name: Judge every outcome, end to end
        env:
          AJ_DOCKER_NETWORK: algojudge-runner-dev_default
          AJ_TEST_SERVER: http://server:8080/api/v1
          # One case sends the Runner a real SIGTERM, which is the one thing
          # HTTP cannot do to it.
          AJ_DOCKER_SOCKET: 1
        run: >
          ./x test -p aj-runner --test end_to_end
          -- --include-ignored --test-threads=1
          --skip a_window_does_not_cost_a_participant_their_submission

      # Its own step because it needs a different network, not because it is a
      # different kind of test.
      #
      # The maintenance switch answers only to a caller on the **Server's own
      # loopback interface** — that is the whole of its authorization, and a
      # test on the stack's network would get the 404 it is supposed to get.
      # Sharing the container's network namespace is how a test becomes a local
      # caller; `127.0.0.1:8080` then really is the Server's own.
      - name: A maintenance window does not cost a participant their submission
        env:
          AJ_DOCKER_NETWORK: container:algojudge-runner-dev-server-1
          AJ_TEST_SERVER: http://127.0.0.1:8080/api/v1
        run: >
          ./x test -p aj-runner --test end_to_end
          -- --include-ignored --test-threads=1
          --exact a_window_does_not_cost_a_participant_their_submission

      # M3's mechanical half. A test cannot honestly assert something about a
      # repository it is not in, so it is asserted here, against the checkout
      # the stack was built from: **adding a problem type left the Server
      # untouched, or it did not.**
      - name: The Server learned nothing about the second problem type
        run: |
          cd algojudge-server
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          echo "the Server checkout is unchanged"

      # **Asserted on the host, because a test cannot see what it left.** The
      # Runner in this stack has judged a dozen submissions by now, and neither
      # backend may have kept a cgroup for any of them.
      #
      # The shapes differ, and so does what is allowed to remain. Under
      # `cgroupfs` the Runner's own directory stays and every run's is removed,
      # so `algojudge/` must be empty. Under `systemd` one slice per Runner
      # stays — that is the whole design, since a slice per run would be a
      # systemd unit per run and nothing collects those — so the assertion is
      # that no slice has anything *inside* it.
      - name: No per-run cgroup was left behind
        if: always()
        run: |
          case "${{ matrix.driver }}" in
            cgroupfs) home=/sys/fs/cgroup/algojudge ;;
            systemd)  home=/sys/fs/cgroup/algojudge.slice ;;
          esac
          if [ ! -d "$home" ]; then echo "$home was never created"; exit 0; fi
          sudo find "$home" -mindepth 1 -maxdepth 2 -type d
          test -z "$(sudo find "$home" -mindepth 2 -type d)"
          case "${{ matrix.driver }}" in
            cgroupfs) test -z "$(sudo find "$home" -mindepth 1 -maxdepth 1 -type d)" ;;
          esac

      - name: What the Runner said
        if: always()
        run: >
          docker compose -f example-runner-development-docker-compose.yaml
          logs --no-color runner

      - name: Tear it down
        if: always()
        run: >
          docker compose -f example-runner-development-docker-compose.yaml
          down -v

  # The release gate for the evaluation pipeline (D-8, 2026-08-06). Every case is
  # a thing untrusted code will try; a suite that is not a gate is not a gate.
  #
  # It runs here rather than only on a developer's machine because this host has
  # **cgroup v2**, which the Runner requires and which Docker Desktop may not
  # provide — the memory case is skipped without it, and skipping it locally is
  # exactly why it has to be asserted somewhere. Since 2026-09-03 it also runs
  # here because this host can be given **either** cgroup driver, which a
  # workstation on Docker Desktop cannot: that Linux VM does not run systemd, so
  # only one of the two measurement backends is reachable there.
  adversarial:
    name: adversarial (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [cgroupfs, systemd]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Give the daemon the ${{ matrix.driver }} cgroup driver
        run: |
          echo '{"exec-opts":["native.cgroupdriver=${{ matrix.driver }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # Both halves, because the measurement cases return early where there is
      # nothing to read — so a leg on the wrong driver would pass while
      # asserting nothing at all.
      - name: Show what this host can enforce
        run: |
          docker info --format 'cgroup {{.CgroupVersion}} / {{.CgroupDriver}}, kernel {{.KernelVersion}}'
          test "$(docker info --format '{{.CgroupVersion}}/{{.CgroupDriver}}')" = "2/${{ matrix.driver }}"

      - name: Build the language images
        run: |
          docker build -t algojudge/lang-gcc:local    -f images/gcc/Dockerfile images/
          docker build -t algojudge/lang-clang:local  -f images/clang/Dockerfile images/
          docker build -t algojudge/lang-python:local -f images/python/Dockerfile images/
          docker build -t algojudge/lang-pypy:local   -f images/pypy/Dockerfile images/

      - name: Run the adversarial suite
        env:
          AJ_DOCKER_SOCKET: "1"
        run: >
          ./x test -p aj-sandbox --test adversarial
          -- --include-ignored --test-threads=1

      # The one that proves the whole thing: a submission goes in, a mark comes
      # out, and it is the right mark.
      - name: Judge real submissions
        env:
          AJ_DOCKER_SOCKET: "1"
        run: >
          ./x test -p aj-standard-io --test judging
          -- --include-ignored --test-threads=1

      # The same assertion as in `integration`, and here the suite that judges
      # has just run some fifty containers through one backend.
      - name: No per-run cgroup was left behind
        if: always()
        run: |
          case "${{ matrix.driver }}" in
            cgroupfs) home=/sys/fs/cgroup/algojudge ;;
            systemd)  home=/sys/fs/cgroup/algojudge.slice ;;
          esac
          if [ ! -d "$home" ]; then echo "$home was never created"; exit 0; fi
          sudo find "$home" -mindepth 1 -maxdepth 2 -type d
          test -z "$(sudo find "$home" -mindepth 2 -type d)"
          case "${{ matrix.driver }}" in
            cgroupfs) test -z "$(sudo find "$home" -mindepth 1 -maxdepth 1 -type d)" ;;
          esac

      - name: Leave no sandboxes behind
        if: always()
        run: docker ps -aq --filter label=algojudge.sandbox=1 | xargs -r docker rm -f

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Built, not pushed — a choice rather than a gap. Building is what catches
      # a Dockerfile that stopped matching the workspace, and `release.yml`
      # publishes this image and both language images to `ghcr.io/algojudge`
      # when somebody pushes a `v*` tag.
      - name: Build the container image
        run: docker build -t algojudge-runner:ci .
